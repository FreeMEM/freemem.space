# /etc/default/wordpress-actualizar del CT 126 (freemem.space, WordPress en Docker)
MODO=docker
NOMBRE=freemem
PROYECTO=freememspace
HOST=freemem.space
# La web pública (Next.js) y la API de la que vive.
PRUEBAS="/ /feed/ /wp-json/wp/v2/posts?per_page=1 /wp-json/wp/v2/pages?per_page=1"
# Lo que se sabe bueno. Cualquier otra cosa hace saltar la alerta de integridad.
ADMINS="admin"
MU_PLUGINS="freemem-headless.php"
PLUGINS_PROPIOS=""
PLUGINS_SUMA_MAL_CONOCIDA=""
NUCLEO_EXTRA_CONOCIDO="wp-config-docker.php"  # lo pone la imagen oficial de Docker
# Para bajar los domingos la imagen de PHP con los parches (wordpress:php8.3-fpm).
COMPOSE_DIR=/root/freemem.space
COMPOSE_FICHEROS="-f docker-compose.yml -f docker-compose.prod.yml"
