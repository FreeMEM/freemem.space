# El log_format «main» de la imagen apunta $realip_remote_addr, que es la IP del
# balanceador. Este apunta $remote_addr, que con PROXY protocol es la del visitante.
log_format visitante '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent" "$http_x_forwarded_for"';

# Registro de visitas en JSON para Loki y el panel «freemem.space / Visitas» de
# Grafana (vigía, CT 125). Sin datos personales, para no necesitar consentimiento:
# ni IP ni user-agent; de la IP solo la red /16 (como Matomo por defecto), del
# user-agent si es robot o móvil, y del referer solo el dominio.
map $http_user_agent $es_bot {
    default 0;
    "" 1;
    ~*(bot|crawl|spider|slurp|fetch|curl|wget|python|httpclient|okhttp|java/|go-http|monitor|uptime|preview|scan|headless|lighthouse|blackbox|feed|rss) 1;
}
map $http_user_agent $es_movil {
    default 0;
    ~*(mobile|android|iphone|ipad) 1;
}
map $http_referer $origen {
    default "";
    ~^https?://(?:www\.)?([^/:]+) $1;
}
map $remote_addr $red {
    default "";
    ~^(\d+)\.(\d+)\. $1.$2.0.0;
    ~^([0-9a-fA-F]+):([0-9a-fA-F]+): $1:$2::;
}
map $uri $tipo {
    default pagina;
    ~^/_next/ estatico;
    ~^/wp-json/ api;
    ~^/wp-(admin|login|includes|cron) admin;
    ~^/wp-content/ medio;
    ~^/feed/ rss;
    ~^/llms(-full)?\.txt$ ia;
    ~/index\.md$ ia;
    ~\.(ico|png|jpe?g|gif|svg|webp|css|js|txt|xml|html|php)$ archivo;
}
log_format visitas_json escape=json
  '{"t":"$time_iso8601","host":"$host","metodo":"$request_method",'
  '"ruta":"$uri","estado":$status,"bytes":$body_bytes_sent,'
  '"tiempo":$request_time,"tiempo_app":"$upstream_response_time",'
  '"tipo":"$tipo","bot":$es_bot,"movil":$es_movil,"origen":"$origen","red":"$red"}';

# Compresión: ni Next.js (compress: false) ni WordPress comprimen; lo hace nginx
# para todo, también lo que sale de la caché.
gzip on;
gzip_comp_level 5;
gzip_min_length 512;
gzip_vary on;
gzip_proxied any;
gzip_types text/css text/plain text/markdown text/xml application/javascript application/json application/xml application/rss+xml image/svg+xml;

# Caché de páginas del frontend. Next.js genera cada página al pedirla; aquí se
# guarda 60 s y se renueva en segundo plano, así un pico de visitas no llega a
# Next.js. Lo de /_next/ (JS, CSS e imágenes optimizadas) no cambia: 30 días.
proxy_cache_path /var/cache/nginx/paginas levels=1:2 keys_zone=paginas:20m max_size=1g inactive=30d use_temp_path=off;

# Sin caché para quien escribe: sesión de WordPress abierta, envíos y la API de Next.js
map "$request_method:$http_cookie" $sin_cache {
    default 0;
    ~^(POST|PUT|PATCH|DELETE) 1;
    ~wordpress_logged_in_ 1;
}

# Las imágenes optimizadas cambian de formato según el navegador
map $http_accept $formato_imagen {
    default otro;
    ~image/avif avif;
    ~image/webp webp;
}

# Next.js marca las páginas «no-store» (se generan al pedirlas), lo que impide la
# caché de atrás/adelante del navegador. Para las páginas se cambia por una que
# obliga a revalidar; lo de /_next/ y WordPress conservan su cabecera.
map $uri $control_paginas {
    default "public, max-age=0, must-revalidate";
    ~^/_next/ "";
    ~^/wp- "";
    ~^/api/ "";
    ~^/\.well-known/ "";
}

# Política de contenido de las páginas del frontend. 'unsafe-inline' en scripts
# hace falta porque Next.js mete los datos de la página en <script> en línea y la
# caché de nginx no permite un nonce por respuesta; aun así, ningún script puede
# venir de fuera salvo Google Analytics, ni la página puede enviar datos a otro
# sitio. wp-admin y la API llevan las suyas (sin CSP de aquí).
map $uri $csp_paginas {
    default "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; frame-src https://www.youtube-nocookie.com https://www.youtube.com https://player.vimeo.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests";
    ~^/wp- "";
    ~^/_next/ "";
}

limit_req_zone $binary_remote_addr zone=comentarios:10m rate=6r/m;

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=wp_login:10m rate=1r/s;
limit_req_zone $binary_remote_addr zone=wp_admin:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

# Bloque común a los PHP que sí ejecuta WordPress
# (no hay include de fichero propio para no depender de rutas de la imagen)

# Redirect HTTP -> HTTPS
server {
    listen 80;
    server_name freemem.space tapiasbravo.com www.tapiasbravo.com blog.tapiasbravo.com;
    access_log /var/log/nginx/access.log visitante;

    # Certbot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://freemem.space$request_uri;
    }
}

# Dominios antiguos: todo a freemem.space conservando la ruta
server {
    listen 443 ssl;
    listen 9443 ssl proxy_protocol;
    set_real_ip_from 10.0.0.1;
    real_ip_header proxy_protocol;
    http2 on;
    server_name tapiasbravo.com www.tapiasbravo.com blog.tapiasbravo.com;
    access_log /var/log/nginx/access.log visitante;

    ssl_certificate /etc/letsencrypt/live/blog.tapiasbravo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blog.tapiasbravo.com/privkey.pem;

    return 301 https://freemem.space$request_uri;
}

# API interna para Next.js: solo red de docker, sin TLS y sin balanceador.
# No se publica en ningún puerto del contenedor.
server {
    listen 8081;
    server_name nginx;
    access_log off;

    allow 172.16.0.0/12;
    deny all;

    location /wp-json/ {
        root /var/www/html;
        fastcgi_pass wordpress:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        # WordPress debe creer que le hablan por https://freemem.space para que
        # las URLs que devuelve sean las públicas.
        fastcgi_param HTTP_HOST freemem.space;
        fastcgi_param SERVER_NAME freemem.space;
        fastcgi_param HTTPS on;
        fastcgi_param SERVER_PORT 443;
    }

    location / {
        return 404;
    }
}

# HTTPS
server {
    listen 443 ssl;
    # El balanceador (CT 101) entra por el 9443 con PROXY protocol (el 8443 es
    # del servidor por defecto de la imagen), para que nginx, ModSecurity y los
    # límites de peticiones vean la IP del visitante y no la del balanceador.
    listen 9443 ssl proxy_protocol;
    set_real_ip_from 10.0.0.1;
    real_ip_header proxy_protocol;
    http2 on;
    server_name freemem.space;
    access_log /var/log/nginx/access.log visitante;
    access_log /var/log/nginx/visitas/visitas.json visitas_json;

    ssl_certificate /etc/letsencrypt/live/freemem.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/freemem.space/privkey.pem;

    # SSL config recomendada
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

    # Headers de seguridad
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # Van aquí y no en las location: un add_header dentro de una location anula
    # todos los de arriba. Con valor vacío nginx no pone la cabecera.
    add_header Cache-Control $control_paginas always;
    add_header X-Cache $upstream_cache_status always;
    add_header Content-Security-Policy $csp_paginas always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    client_max_body_size 64M;

    # ============================================
    # BLOQUEOS DE SEGURIDAD
    # ============================================

    location = /xmlrpc.php {
        return 403;
    }

    location ~* /(?:wp-config\.php|readme\.html|license\.txt|wp-config-sample\.php)$ {
        return 403;
    }

    # Archivos ocultos, salvo los retos de Let's Encrypt
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location ~ /\. {
        return 403;
    }

    # ============================================
    # FRONTEND NEXT.JS
    # ============================================

    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Next.js sirve en la misma dirección el HTML y los datos con los que navega
        # entre páginas (cabecera RSC): van a entradas distintas de la caché.
        proxy_set_header Accept-Encoding "";
        proxy_cache paginas;
        proxy_cache_key "$scheme$host$request_uri|$http_rsc|$http_next_router_prefetch|$http_next_router_segment_prefetch|$http_next_router_state_tree";
        proxy_cache_valid 200 301 308 60s;
        proxy_cache_valid 404 30s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;
        proxy_hide_header Cache-Control;
        proxy_hide_header X-Nextjs-Cache;
        proxy_hide_header X-Nextjs-Prerender;
        proxy_hide_header X-Nextjs-Stale-Time;
        proxy_hide_header X-Powered-By;
        proxy_cache_bypass $sin_cache;
        proxy_no_cache $sin_cache;
    }

    # /api/revalidate solo lo llama WordPress, por dentro (http://frontend:3000):
    # desde fuera no existe.
    location ^~ /api/ {
        return 404;
    }

    # Comentarios: como mucho 6 por minuto y dirección, para frenar a los robots
    location = /wp-json/wp/v2/comments {
        limit_req zone=comentarios burst=3 nodelay;
        limit_req_status 429;

        root /var/www/html;
        fastcgi_pass wordpress:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
    }

    # JS, CSS e imágenes optimizadas: no cambian una vez publicados
    location ^~ /_next/ {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Accept-Encoding "";
        proxy_cache paginas;
        proxy_cache_key "$host$request_uri|$formato_imagen";
        proxy_cache_valid 200 30d;
        proxy_cache_use_stale error timeout updating;
        proxy_cache_lock on;
        proxy_ignore_headers Set-Cookie Vary;
        proxy_hide_header X-Nextjs-Cache;
        proxy_hide_header X-Powered-By;
    }

    # ============================================
    # WORDPRESS API
    # ============================================

    location /wp-json/ {
        limit_req zone=api burst=50 nodelay;

        root /var/www/html;
        fastcgi_pass wordpress:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
    }

    # ============================================
    # WORDPRESS ADMIN (protegido)
    # ============================================

    location /wp-admin/ {
        limit_req zone=wp_admin burst=20 nodelay;

        root /var/www/html;
        index index.php;
        try_files $uri $uri/ /wp-admin/index.php?$args;

        # Solo los PHP que trae WordPress en wp-admin y sus subcarpetas oficiales.
        # Un PHP colado en wp-admin/images o wp-admin/network con nombre inventado
        # se sigue ejecutando si existe: la defensa es que el núcleo no se pueda
        # escribir (DISALLOW_FILE_MODS) y la comprobación diaria de sumas.
        location ~ \.php$ {
            fastcgi_pass wordpress:9000;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
        }
    }

    location = /wp-login.php {
        limit_req zone=wp_login burst=5 nodelay;
        limit_req_status 429;

        root /var/www/html;
        fastcgi_pass wordpress:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # ============================================
    # WORDPRESS ASSETS (solo lectura)
    # ============================================

    location ^~ /wp-includes/ {
        root /var/www/html;
        expires 30d;
        add_header Cache-Control "public, immutable";

        location ~ \.php$ {
            return 403;
        }
    }

    location ^~ /wp-content/uploads/ {
        root /var/www/html;
        expires 30d;
        add_header Cache-Control "public";

        # En uploads solo se sirven ficheros, nunca se ejecutan
        location ~* \.(php|phtml|phar|pl|py|cgi|sh)$ {
            return 403;
        }
    }

    # Solo servir assets estaticos de wp-content (CSS, JS, imagenes)
    location ~* ^/wp-content/.*\.(css|js|png|jpg|jpeg|gif|webp|ico|svg|woff|woff2|ttf|eot)$ {
        root /var/www/html;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ============================================
    # BLOQUEOS FINALES
    # ============================================

    # Ningún otro PHP: ni wp-cron.php (lo lanza el temporizador del CT con
    # WP-CLI), ni wp-content/*, ni lo que alguien consiga dejar en disco.
    location ~ \.php$ {
        return 403;
    }
}
