# Producción - Usar con:
# docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  wordpress:
    logging: &logs
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  db:
    logging: *logs

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # En la construcción Next.js genera las páginas leyendo la API por la red
        # interna, sin pasar por el balanceador ni el WAF.
        WORDPRESS_API_URL: http://nginx:8081/wp-json
        NEXT_PUBLIC_SITE_URL: ${WP_HOME:-https://freemem.space}
        # Google Analytics 4 de freemem.space (el de Site Kit en el sitio antiguo).
        # No es secreto: va en el HTML. Solo se carga si el visitante acepta.
        NEXT_PUBLIC_GA_ID: ${GA_ID:-G-K9SH40W4GY}
    restart: unless-stopped
    logging: *logs
    depends_on:
      - wordpress
    # El optimizador de imágenes pide https://freemem.space/wp-content/uploads/…:
    # dentro del CT ese nombre tiene que llegar al nginx de aquí, no dar la vuelta
    # por la IP pública (cosmos no hace NAT loopback).
    extra_hosts:
      - "freemem.space:host-gateway"
    environment:
      - WORDPRESS_API_URL=http://nginx:8081/wp-json
      - NEXT_PUBLIC_SITE_URL=${WP_HOME:-https://freemem.space}
      - REVALIDATE_SECRET=${REVALIDATE_SECRET}
    networks:
      - backend

  nginx:
    image: owasp/modsecurity-crs:4.25-nginx-alpine-lts
    logging: *logs
    restart: unless-stopped
    depends_on:
      - wordpress
    ports:
      - "80:80"
      - "443:443"
      - "9443:9443"
    environment:
      - MODSEC_RULE_ENGINE=On
      - MODSEC_AUDIT_LOG=/dev/stdout
      - BLOCKING_PARANOIA=1
      # Desactiva la inspeccion del cuerpo de respuesta: el buffering de
      # libmodsecurity rompe el framing HTTP/2 (ERR_HTTP2_PROTOCOL_ERROR)
      # en respuestas generadas por PHP como /wp-admin/. Mantiene el WAF de entrada.
      - MODSEC_RESP_BODY_ACCESS=Off
      - ALLOWED_METHODS=GET HEAD POST OPTIONS PUT DELETE
      - MAX_FILE_SIZE=67108864
      - MODSEC_REQ_BODY_LIMIT=67108864
      - MODSEC_REQ_BODY_LIMIT_ACTION=ProcessPartial
      - MAX_NUM_ARGS=512
      - ARG_LENGTH=8000
      - TOTAL_ARG_LENGTH=64000
    volumes:
      - ./nginx/site.conf:/etc/nginx/conf.d/site.conf:ro
      - ./nginx/modsecurity/REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf:/etc/modsecurity.d/owasp-crs/rules/REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf:ro
      - ./nginx/modsecurity/RESPONSE-999-EXCLUSION-RULES-AFTER-CRS.conf:/etc/modsecurity.d/owasp-crs/rules/RESPONSE-999-EXCLUSION-RULES-AFTER-CRS.conf:ro
      - ./nginx/modsecurity/plugins/freemem-before.conf:/etc/modsecurity.d/owasp-crs/plugins/freemem-before.conf:ro
      - ./nginx/modsecurity/plugins/wordpress-rule-exclusions-config.conf:/etc/modsecurity.d/owasp-crs/plugins/wordpress-rule-exclusions-config.conf:ro
      - ./nginx/modsecurity/plugins/wordpress-rule-exclusions-before.conf:/etc/modsecurity.d/owasp-crs/plugins/wordpress-rule-exclusions-before.conf:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - wp_data:/var/www/html:ro
      # visitas.json lo lee promtail en el CT y lo manda a Loki (vigía)
      - ./registros:/var/log/nginx/visitas
    networks:
      - backend

  certbot:
    image: certbot/certbot
    logging: *logs
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    # nginx (imagen CRS) corre como uid 101 y certbot deja las claves en 600: se le da
    # lectura por grupo al renovar. La recarga de nginx la hace un temporizador del CT.
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --deploy-hook \"chgrp 101 /etc/letsencrypt/archive/*/privkey*.pem; chmod 640 /etc/letsencrypt/archive/*/privkey*.pem\"; sleep 12h & wait $${!}; done;'"
