# Avisos y peticiones de cambio cuando una dependencia tiene una versión nueva o un
# fallo de seguridad conocido. Se revisan y se fusionan a mano.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
